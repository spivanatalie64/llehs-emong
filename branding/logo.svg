<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111318"/>
      <stop offset="100%" style="stop-color:#1a1d24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="xlibre" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#eab308"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="200" rx="16" fill="url(#bg)"/>

  <!-- Decorative X for XLibre -->
  <g transform="translate(40,100)">
    <line x1="-22" y1="-22" x2="22" y2="22" stroke="url(#xlibre)" stroke-width="6" stroke-linecap="round"/>
    <line x1="22" y1="-22" x2="-22" y2="22" stroke="url(#xlibre)" stroke-width="6" stroke-linecap="round"/>
    <!-- circle around the X -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- EMONG wordmark -->
  <text x="90" y="90" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800"
        font-size="52" letter-spacing="-1" fill="url(#accent)">EMONG</text>

  <!-- Tagline -->
  <text x="90" y="118" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400"
        font-size="16" fill="#cbd5e1" letter-spacing="0.5">Calm shell chrome, Cinnamon-inspired.</text>

  <!-- llehs-emong label -->
  <text x="90" y="150" font-family="'Courier New',Courier,monospace" font-weight="700"
        font-size="13" fill="url(#xlibre)" opacity="0.8">llehs-emong</text>

  <!-- XLibre badge -->
  <rect x="90" y="162" width="90" height="22" rx="11" fill="none" stroke="url(#xlibre)" stroke-width="1.5" opacity="0.5"/>
  <text x="135" y="177" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="11" fill="url(#xlibre)" font-weight="600">XLibre / X11</text>
</svg>
